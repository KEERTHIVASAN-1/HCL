server.port=8080
spring.application.name=hostel-java

# MongoDB
# Default: local MongoDB.
# Override with an env var for local or Atlas, for example:
#   MONGODB_URI=mongodb://localhost:27017/hostel_java
#   MONGODB_URI=mongodb+srv://<user>:<pass>@<cluster>/<db>
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hostel_java}
spring.data.mongodb.auto-index-creation=true

# Demo credentials (change via env vars before production)
# The DataInitializer reads these at startup to create demo accounts idempotently.
hostel.demo.admin.username=${HOSTEL_ADMIN_USER:admin}
hostel.demo.admin.password=${HOSTEL_ADMIN_PASS:admin123}
hostel.demo.warden.username=${HOSTEL_WARDEN_USER:warden}
hostel.demo.warden.password=${HOSTEL_WARDEN_PASS:warden123}
hostel.demo.student.username=${HOSTEL_STUDENT_USER:student1@hostel.local}
hostel.demo.student.password=${HOSTEL_STUDENT_PASS:student123}
hostel.demo.maintenance.username=${HOSTEL_MAINT_USER:maintenance}
hostel.demo.maintenance.password=${HOSTEL_MAINT_PASS:maint123}
hostel.student.default-password=${HOSTEL_NEW_STUDENT_PASS:student123}

logging.level.org.springframework.security=INFO
